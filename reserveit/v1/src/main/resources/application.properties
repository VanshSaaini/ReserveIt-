spring.application.name=ReserveIt

# ---- Database ----
# No hardcoded credentials: override via env vars (DB_URL / DB_USERNAME / DB_PASSWORD)
# in every environment, including local dev, so nothing sensitive is committed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reserveit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:saini18}

# "update" auto-evolves the schema and is convenient for local dev, but it's not
# safe for production (it can silently apply unreviewed changes). Use a real
# migration tool (Flyway/Liquibase) with ddl-auto=validate before going live.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open Session In View is on by default in Spring Boot, which silently keeps a
# DB connection open for the whole HTTP request just so lazy associations can
# still be read late (e.g. during JSON serialization). Spring Boot itself now
# flags this as deprecated. Every service method that maps a lazy association
# (Doctor -> User, Appointment -> Patient/Doctor/Clinic, Clinic -> admin, etc.)
# is wrapped in an explicit @Transactional(readOnly = true) instead, so it's
# safe to turn this off.
spring.jpa.open-in-view=false

# ---- JWT ----
# 256-bit+ secret used to sign tokens. Override with an env var in real deployments:
# JWT_SECRET=... JWT_EXPIRATION_MS=...
jwt.secret=${JWT_SECRET:c2VjdXJlLXJlc2VydmVpdC1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS (React/Vite dev server) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---- Super admin bootstrap ----
# Created automatically on startup if no user with this email exists yet.
app.admin.email=${ADMIN_EMAIL:admin@reserveit.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ---- Gmail SMTP ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# ---- Subscription lifecycle ----
# Hourly expiration/EXPIRING checks. Override in production if needed.
app.subscription.expiration-cron=${SUBSCRIPTION_EXPIRATION_CRON:0 0 * * * *}
